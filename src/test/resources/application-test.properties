# Profil testowy: każdy kontekst Springa dostaje własną bazę w pamięci
# (${random.uuid} jest rozwijane raz dla kontekstu), więc buforowane konteksty
# z różną konfiguracją nie współdzielą danych.
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
logging.level.com.example.clinic=DEBUG

