# Profil "local-file": baza H2 w pliku. Dane przetrwają restart aplikacji.
# Drugi start na tej samej bazie nie wykonuje ponownie zastosowanych changesetów:
# Liquibase porównuje changelog z tabelą DATABASECHANGELOG.
# AUTO_SERVER=TRUE pozwala podłączyć się do pliku z drugiego procesu (np. IDE).
spring.datasource.url=jdbc:h2:file:./target/data/clinic;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000

