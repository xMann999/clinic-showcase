# ---------------------------------------------------------------------------
# Spring Clinic Showcase - konfiguracja podstawowa (bez profilu).
# Start nie wymaga żadnej zewnętrznej usługi: H2 w pamięci + migracje Liquibase.
# ---------------------------------------------------------------------------
spring.application.name=clinic-showcase

# --- Baza danych -----------------------------------------------------------
# DB_CLOSE_DELAY=-1: baza w pamięci żyje do końca procesu, a nie do zamknięcia
# ostatniego połączenia. LOCK_TIMEOUT: ile milisekund transakcja czeka na blokadę
# wiersza (np. SELECT ... FOR UPDATE doktora) zanim dostanie błąd.
# Dane dostępu w realnym środowisku podaje się z zewnątrz (zmienne środowiskowe),
# nie zapisuje w repozytorium.
spring.datasource.url=jdbc:h2:mem:clinic;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# --- Schemat ---------------------------------------------------------------
# Liquibase jest jedynym właścicielem schematu. Hibernate tylko sprawdza
# (validate), czy encje pasują do tabel; niczego nie tworzy ani nie zmienia.
# validate NIE jest pełnym audytem indeksów i ograniczeń - te testujemy osobno.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Liquibase 5 potrafi wysyłać anonimowe statystyki użycia - start ma nie wymagać sieci.
spring.liquibase.analytics-enabled=false
spring.jpa.hibernate.ddl-auto=validate
# schema.sql/data.sql nie działają równolegle z migracjami.
spring.sql.init.mode=never

# Open Session In View wyłączone: relacje LAZY muszą zostać odczytane w serwisie,
# w transakcji. Nie "naprawiamy" LazyInitializationException włączaniem OSIV.
spring.jpa.open-in-view=false

# --- Klinika -----------------------------------------------------------------
# Jedna strefa czasowa przychodni; terminy w JSON nie mają offsetu.
clinic.zone-id=Europe/Warsaw

# --- OpenAPI -----------------------------------------------------------------
# Dokumentację można wyłączyć np. na produkcji: springdoc.api-docs.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**

# --- Logi ----------------------------------------------------------------------
# requestId z MDC trafia do każdej linii logu obok poziomu.
logging.pattern.level=%5p [requestId=%X{requestId:-}]
logging.level.root=INFO
logging.level.com.example.clinic=INFO


